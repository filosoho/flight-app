  init.sql: "-- Flight App database initialization\n-- Generated from the verified
    flight-app-backup.sql\n-- Intended for a fresh PostgreSQL database.\n\n-- Sequences\nCREATE
    SEQUENCE public.flights_id_seq;\nCREATE SEQUENCE public.states_id_seq;\nCREATE
    SEQUENCE public.tickets_id_seq;\nCREATE SEQUENCE public.users_id_seq;\n\n-- Tables\nCREATE
    TABLE public.flights (\n    id integer NOT NULL,\n    departure_state varchar(255)
    NOT NULL,\n    arrival_state varchar(255) NOT NULL,\n    departure_time timestamp
    without time zone NOT NULL,\n    arrival_time timestamp without time zone NOT
    NULL,\n    price numeric(10,2) NOT NULL\n);\n\nCREATE TABLE public.states (\n
    \   id integer NOT NULL,\n    state_code varchar(2) NOT NULL,\n    state_name
    varchar(50) NOT NULL\n);\n\nCREATE TABLE public.tickets (\n    id integer NOT
    NULL,\n    ticket_number varchar(50) NOT NULL,\n    departure_state varchar(50)
    NOT NULL,\n    arrival_state varchar(50) NOT NULL,\n    departure_time timestamp
    without time zone NOT NULL,\n    arrival_time timestamp without time zone NOT
    NULL,\n    ticket_price numeric(10,2) NOT NULL,\n    status varchar(20) DEFAULT
    'CONFIRMED'::varchar NOT NULL,\n    user_id integer NOT NULL\n);\n\nCREATE TABLE
    public.users (\n    id integer NOT NULL,\n    name varchar(50) NOT NULL,\n    password
    varchar(255) NOT NULL,\n    email varchar(255) NOT NULL\n);\n\n-- ID defaults\nALTER
    TABLE ONLY public.flights\n    ALTER COLUMN id SET DEFAULT nextval('public.flights_id_seq'::regclass);\n\nALTER
    TABLE ONLY public.states\n    ALTER COLUMN id SET DEFAULT nextval('public.states_id_seq'::regclass);\n\nALTER
    TABLE ONLY public.tickets\n    ALTER COLUMN id SET DEFAULT nextval('public.tickets_id_seq'::regclass);\n\nALTER
    TABLE ONLY public.users\n    ALTER COLUMN id SET DEFAULT nextval('public.users_id_seq'::regclass);\n\n--
    Sequence ownership\nALTER SEQUENCE public.flights_id_seq OWNED BY public.flights.id;\nALTER
    SEQUENCE public.states_id_seq OWNED BY public.states.id;\nALTER SEQUENCE public.tickets_id_seq
    OWNED BY public.tickets.id;\nALTER SEQUENCE public.users_id_seq OWNED BY public.users.id;\n\nCOPY
    public.flights (id, departure_state, arrival_state, departure_time, arrival_time,
